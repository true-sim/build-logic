name: Set up Vulkan
description: >
  Vulkan for headless Linux runners: Mesa's lavapipe (a CPU Vulkan device), the Khronos validation layer and, if the
  image lacks it, the loader, unpacked from cached packages so the versions stay fixed between runs. Checks that a
  Vulkan 1.3 device and the validation layer are there, writes their versions to the job summary, and sets
  SDL_VIDEO_DRIVER=offscreen and TRUESIM_REQUIRE_VALIDATION=true for later steps.

inputs:
  cache-version:
    description: >
      Part of the package cache key. Bump it to pick up newer packages; while it stays, every run installs the same
      ones (until the cache expires after 7 days without use).
    default: "1"
  min-api-version:
    description: The lowest Vulkan version the device must offer, as major.minor.
    default: "1.3"

outputs:
  api-version:
    description: The Vulkan version of the lavapipe device, e.g. 1.4.335.
    value: ${{ steps.check.outputs.api-version }}
  driver:
    description: The driver, e.g. Mesa 26.0.8.
    value: ${{ steps.check.outputs.driver }}
  validation-layer:
    description: The validation layer version, e.g. 1.4.341.
    value: ${{ steps.check.outputs.validation-layer }}

runs:
  using: composite
  steps:
    - name: Identify the runner image
      id: os
      shell: bash
      run: |
        . /etc/os-release
        echo "release=${ID}-${VERSION_ID}-$(uname -m)" >> "$GITHUB_OUTPUT"

    - name: Restore Vulkan packages
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/truesim-vulkan-debs
        key: truesim-vulkan-${{ steps.os.outputs.release }}-${{ inputs.cache-version }}

    - name: Download Vulkan packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get clean
        sudo apt-get install -y --download-only --no-install-recommends \
          libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
        mkdir -p ~/.cache/truesim-vulkan-debs
        cp /var/cache/apt/archives/*.deb ~/.cache/truesim-vulkan-debs/
        ls ~/.cache/truesim-vulkan-debs

    - name: Install Vulkan packages
      shell: bash
      run: |
        # Unpacked into a directory instead of installed: no apt or dpkg lock to wait for (the image's own apt
        # jobs can hold it for minutes), no root, and exactly the cached versions. The loader is pointed at them.
        root="$HOME/.cache/truesim-vulkan-root"
        rm -rf "$root"
        mkdir -p "$root"
        for deb in ~/.cache/truesim-vulkan-debs/*.deb; do
          dpkg-deb -x "$deb" "$root"
        done
        lib="$root/usr/lib/$(uname -m)-linux-gnu"
        icd=$(ls "$root"/usr/share/vulkan/icd.d/lvp_icd*.json)
        sed -i "s#\"/usr/lib/#\"$root/usr/lib/#" "$icd"
        {
          echo "VK_DRIVER_FILES=$icd"
          echo "VK_ADD_LAYER_PATH=$root/usr/share/vulkan/explicit_layer.d"
          echo "LD_LIBRARY_PATH=$lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        } >> "$GITHUB_ENV"
        echo "$root/usr/bin" >> "$GITHUB_PATH"

    - name: Check Vulkan
      id: check
      shell: bash
      env:
        MIN_API: ${{ inputs.min-api-version }}
      run: |
        summary=$(vulkaninfo --summary)
        echo "$summary"
        api=$(echo "$summary" | awk '/apiVersion/ {print $3; exit}')
        driver=$(echo "$summary" | awk -F'= ' '/driverInfo/ {print $2; exit}')
        layer=$(echo "$summary" | awk '/VK_LAYER_KHRONOS_validation/ {print $(NF-2); exit}')
        if [ -z "$api" ]; then
          echo "::error::No Vulkan device found"
          exit 1
        fi
        if [ "$(printf '%s\n%s\n' "$MIN_API" "$api" | sort -V | head -1)" != "$MIN_API" ]; then
          echo "::error::The Vulkan device offers $api; $MIN_API is needed"
          exit 1
        fi
        if [ -z "$layer" ]; then
          echo "::error::The Khronos validation layer is not installed"
          exit 1
        fi
        echo "api-version=$api" >> "$GITHUB_OUTPUT"
        echo "driver=$driver" >> "$GITHUB_OUTPUT"
        echo "validation-layer=$layer" >> "$GITHUB_OUTPUT"
        {
          echo "### Vulkan"
          echo "| | |"
          echo "|---|---|"
          echo "| Device | lavapipe, Vulkan $api |"
          echo "| Driver | $driver |"
          echo "| Validation layer | $layer |"
          echo "| Packages | ${{ steps.cache.outputs.cache-hit == 'true' && 'cached' || 'downloaded' }} |"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "SDL_VIDEO_DRIVER=offscreen" >> "$GITHUB_ENV"
        echo "TRUESIM_REQUIRE_VALIDATION=true" >> "$GITHUB_ENV"
